apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nameBase }}-backend-config
  labels:
    app: {{ .Values.nameBase }}-backend
data:
  config.properties: |-
    server.servlet.context-path={{ .Values.config.contextPath }}
    server.forward-headers-strategy={{ .Values.config.forwardHeadersStrategy }}
    spring.data.mongodb.uri={{ .Values.config.mongoUri }}
    aimusei.key={{ .Values.config.appKey }}
    logging.level.org.springframework.data.mongodb=DEBUG
    images={{ .Values.config.images }}
    spring.cloud.aws.s3.endpoint={{ .Values.config.s3.endpoint }}
    spring.cloud.aws.s3.region={{ .Values.config.s3.region }}
    spring.cloud.aws.credentials.access-key={{ .Values.config.s3.accessKey }}
    spring.cloud.aws.credentials.secret-key={{ .Values.config.s3.secretKey }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nameBase }}-datasources-config
  labels:
    app: {{ .Values.nameBase }}-backend
data:
  datasources.env: |-
    mongo.host={{ .Values.config.mongoHost }}
    mongo.database={{ .Values.config.mongoDatabase }}
    spring.data.mongodb.uri=mongodb:///{{ .Values.config.mongoHost }}:27017/