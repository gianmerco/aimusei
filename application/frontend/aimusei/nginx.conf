server {
    listen 80;
    listen [::]:80;

    # Directory principale dove si trovano i file compilati di Angular.
    root /usr/share/nginx/html;

    # ----------------------------------------------------------------------
    # 1) Gestione dell'applicazione Angular sotto /aimusei/
    # ----------------------------------------------------------------------
    location /aimusei/ {
        # Prova a servire il file richiesto, poi la cartella,
        # e se non trova nulla, rimanda a index.html per il routing di Angular.
        try_files $uri $uri/ /aimusei/index.html;
    }

    # ----------------------------------------------------------------------
    # 2) Proxy per le chiamate API
    # ----------------------------------------------------------------------
    location /api/ {
        # Indirizzo del tuo servizio di backend.
        # Usa il nome del servizio se sei in Docker Compose (es. http://mio-backend:8090).
        proxy_pass http://backend-service:8090/;

        # Intestazioni consigliate per inoltrare informazioni al backend.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # 3) Redirezione dalla root del sito all'app Angular
    # ----------------------------------------------------------------------
    # La direttiva "location = /" ha la massima priorità e matcha solo la richiesta per "/".
    location = / {
        # Reindirizza permanentemente (301) o temporaneamente (302) alla home dell'app.
        return 301 /aimusei/;
    }

    # ----------------------------------------------------------------------
    # 4) Gestione di altre richieste (opzionale)
    # ----------------------------------------------------------------------
    # Per qualsiasi altra richiesta che non sia /aimusei/ o /api/,
    # prova a servire il file statico corrispondente, altrimenti restituisci un errore 404.
    # Questo evita che una richiesta per un file inesistente (es. /favicon.ico)
    # venga erroneamente reindirizzata all'app Angular.
    location / {
        try_files $uri =404;
    }

    # ----------------------------------------------------------------------
    # 5) Gestione delle pagine di errore (opzionale ma consigliato)
    # ----------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        # La root qui è la stessa definita all'inizio del blocco server.
        root /usr/share/nginx/html;
    }
}
