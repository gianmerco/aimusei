events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Radice dei contenuti serviti da Nginx
        root /usr/share/nginx/html;
        index index.html;

        # ----------------------------------------------------------
        # 1) Asset statici dell'app sotto /aimusei/ (NON riscriverli)
        # ----------------------------------------------------------
        location ~* ^/aimusei/.*\.(js|css|map|json|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
            # 'root' è già impostata sopra a /usr/share/nginx/html
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;  # se il file non esiste -> 404 (non /index.html)
        }

        # ----------------------------------------------------------
        # 2) Fallback SPA SOLO per le route dell'app sotto /aimusei/
        # ----------------------------------------------------------
        location /aimusei/ {
            try_files $uri $uri/ /aimusei/index.html;
        }

        # ----------------------------------------------------------
        # 3) API backend 
        # ----------------------------------------------------------
        location /api/ {
            proxy_pass http://backend-service:8090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------
        # 4) Root del sito:
        #    - opzionale: reindirizza la home a /aimusei/
        #    - alternativa: servi solo file statici e 404 se non esistono
        # ----------------------------------------------------------
        location = / {
            return 302 /aimusei/;
        }

        # Per altre richieste fuori da /aimusei/ e /api/, prova file reali
        location / {
            try_files $uri =404;
        }
    }
}