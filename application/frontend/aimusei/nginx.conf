events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        listen [::]:80;

        # Directory principale dove Nginx cerca i file.
        root /usr/share/nginx/html;

        # Questo è il blocco di configurazione per la tua sottocartella.
        location /aimusei/ {
            # FONDAMENTALE per il routing di Angular:
            # 1. Prova a servire il file esatto richiesto ($uri).
            # 2. Se è una cartella, prova a servire il file index in quella cartella ($uri/).
            # 3. Se fallisce, invece di dare 404, servi /aimusei/index.html e lascia
            #    che sia il router di Angular a gestire la richiesta.
            try_files $uri $uri/ /aimusei/index.html;
        }

        # Opzionale: puoi aggiungere altre configurazioni, come la gestione degli errori.
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

        # ----------------------------------------------------------
        # 2) Fallback SPA SOLO per le route dell'app sotto /aimusei/
        # ----------------------------------------------------------
        location /aimusei/ {
            try_files $uri $uri/ /aimusei/index.html;
        }

        # ----------------------------------------------------------
        # 3) API backend
        # ----------------------------------------------------------
        location /api/ {
            proxy_pass http://backend-service:8090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------
        # 4) Root del sito:
        #    - opzionale: reindirizza la home a /aimusei/
        #    - alternativa: servi solo file statici e 404 se non esistono
        # ----------------------------------------------------------
        location = / {
            return 302 /aimusei/;
        }

        # Per altre richieste fuori da /aimusei/ e /api/, prova file reali
        location / {
            try_files $uri =404;
        }
    }
}
