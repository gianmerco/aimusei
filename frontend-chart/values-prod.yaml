###############################################################################
# values-prod.yaml = OVERLAY PRODUZIONE (cluster adarte)
#
# Uso:
#   helm upgrade --kube-context adarte -n aimusei frontend-app ./frontend-chart/ \
#     -f frontend-chart/values-prod.yaml --reset-values
#
# IMPORTANTE: prima di apply, sempre:
#   helm diff upgrade --kube-context adarte -n aimusei frontend-app \
#     ./frontend-chart/ -f frontend-chart/values-prod.yaml --reset-values
#
# NB: Helm sostituisce gli array, non li merge. Quindi `ingresses` qui sotto
# ridefinisce l'INTERO array senza l'ingress -coll.
###############################################################################

image:
  repository: harbor-adarte.museiitaliani.it/adarte/aimusei-frontend
  tag: "2.14"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-prod-pull

ingresses:
  - enabled: true
    name: aimusei-ingress-locale
    className: "nginx"
    host: "aimusei.local"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    paths:
      - path: /aimusei/api/
        pathType: Prefix
        serviceName: aimusei-be-service
        servicePort: 8090
      - path: /aimusei/
        pathType: Prefix
        serviceName: aimusei-fe-service
        servicePort: 80

  - enabled: true
    name: aimusei-ingress-pubblico
    className: "nginx"
    host: "api.museiitaliani.it"
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    paths:
      - path: /aimusei/api
        pathType: Prefix
        serviceName: aimusei-be-service
        servicePort: 8090
      - path: /aimusei
        pathType: Prefix
        serviceName: aimusei-fe-service
        servicePort: 80
