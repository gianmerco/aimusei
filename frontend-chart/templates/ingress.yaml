  {{- range .Values.ingresses }}

  {{- if .enabled }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  {{- if .annotations }}
  annotations:
      {{- toYaml .annotations | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .className }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:

            {{- range .paths }}
            - path: {{ .path }}
              pathType: {{ .pathType }}
              backend:
                service:
                  name: {{ .serviceName }}
                  port:
                    number: {{ .servicePort }}
            {{- end }}

  {{- end }}

  {{- end }}