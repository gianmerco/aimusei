###############################################################################
# values.yaml = DEFAULT COLLAUDO (cluster adarte-coll)
#
# Per PROD (cluster adarte) usare l'overlay:
#   helm upgrade --kube-context adarte -n aimusei frontend-app ./frontend-chart/ \
#     -f frontend-chart/values-prod.yaml --reset-values
#
# NON modificare gli ingress qui per fare il rilascio prod.
# Procedura completa: vedere [[aimusei-rilasci]] nel vault Obsidian.
###############################################################################

namespace: aimusei
nameBase: "aimusei"
names:
  deployment: aimusei-fe-deployment
  service: aimusei-fe-service
  ingress: aimusei-ingress

replicaCount: 1

image:
  repository: harbor-adarte-coll.museiitaliani.it/adarte/aimusei-frontend
  tag: "2.14"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-coll-pull

service:
  type: ClusterIP
  port: 80

# COLL = 3 ingress: locale, pubblico (host prod ma definito anche su coll storicamente), coll.
# PROD override in values-prod.yaml rimuove l'ingress -coll.
ingresses:
  - enabled: true
    name: aimusei-ingress-locale
    className: "nginx"
    host: "aimusei.local"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    paths:
      - path: /aimusei/api/
        pathType: Prefix
        serviceName: aimusei-be-service
        servicePort: 8090
      - path: /aimusei/
        pathType: Prefix
        serviceName: aimusei-fe-service
        servicePort: 80

  - enabled: true
    name: aimusei-ingress-pubblico
    className: "nginx"
    host: "api.museiitaliani.it"
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    paths:
      - path: /aimusei/api
        pathType: Prefix
        serviceName: aimusei-be-service
        servicePort: 8090
      - path: /aimusei
        pathType: Prefix
        serviceName: aimusei-fe-service
        servicePort: 80

  - enabled: true
    name: aimusei-ingress-coll
    className: "nginx"
    host: "api-coll.museiitaliani.it"
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    paths:
      - path: /aimusei/api
        pathType: Prefix
        serviceName: aimusei-be-service
        servicePort: 8090
      - path: /aimusei
        pathType: Prefix
        serviceName: aimusei-fe-service
        servicePort: 80
